[package]
name = "podcraft-studio"
version = "2.2.2"
description = "点波 TapWave"
authors = ["TapWave Team"]
edition = "2021"

[lib]
name = "podcraft_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rustfft = "6.2"
base64 = "0.22"

[profile.dev]
opt-level = 2
incremental = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

